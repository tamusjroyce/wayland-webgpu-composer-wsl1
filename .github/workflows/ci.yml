name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (workspace build + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  linux-compositor:
    name: Linux (WSL1 compositor build)
    runs-on: ubuntu-22.04
    # The compositor depends on a patched Smithay fork that is NOT vendored in this repo.
    # Set the repo variable `SMITHAY_REPO` (and optionally `SMITHAY_REF`) to enable this job.
    if: ${{ vars.SMITHAY_REPO != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Smithay fork
        run: git clone --depth 1 --branch "${{ vars.SMITHAY_REF || 'main' }}" "${{ vars.SMITHAY_REPO }}" smithay
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/wsl-compositor
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev
      - name: Build compositor
        working-directory: src/wsl-compositor
        run: cargo build
