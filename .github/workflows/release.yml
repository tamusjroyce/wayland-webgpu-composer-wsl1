name: Release

# Build downloadable binaries and attach them to a GitHub Release. Runs when a version tag
# is pushed (git tag v0.1.0 && git push origin v0.1.0) or when called by auto-release.yml.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Tag/release name to create (e.g. v0.1.3).
        required: true
        type: string

permissions:
  contents: write
  id-token: write # for SignPath artifact signing (OIDC)

env:
  CARGO_TERM_COLOR: always
  # The release tag: the pushed tag, or the one passed by auto-release.yml.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows host (win-host, fb-dump)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --locked -p win-host -p fb-dump
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\win-host.exe dist\
          Copy-Item target\release\fb-dump.exe dist\
          Copy-Item install.cmd, run.cmd, run.sh, README.md, LICENSE dist\
          Compress-Archive -Path dist\* -DestinationPath wayland-webgpu-composer-windows-x64.zip -Force
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: wayland-webgpu-composer-windows-x64.zip

  linux:
    name: WSL1 compositor (wsl-compositor)
    # Build on 22.04 for glibc 2.35 compatibility with the Ubuntu 22.04 WSL1 rootfs.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Clone Smithay (configure)
        run: sh ./configure.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/wsl-compositor
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev
      - name: Build release binary
        working-directory: src/wsl-compositor
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist
          cp src/wsl-compositor/target/release/wsl-compositor dist/
          cp install.sh dist/
          cp scripts/wsl1-install.sh dist/ 2>/dev/null || true
          cp README.md LICENSE dist/
          tar -C dist -czf wayland-webgpu-composer-wsl1-x64.tar.gz .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: wayland-webgpu-composer-wsl1-x64.tar.gz

  msix:
    name: MSIX package (Windows)
    runs-on: windows-latest
    env:
      WWC_PFX_BASE64: ${{ secrets.WWC_PFX_BASE64 }}
      WWC_PFX_PASSWORD: ${{ secrets.WWC_PFX_PASSWORD }}
      # When SIGNPATH_API_TOKEN is set, the MSIX is signed by SignPath (trusted, OSS-free)
      # from the CI artifact. Otherwise CI falls back to a self-signed beta certificate.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build host binaries
        run: cargo build --release --locked -p win-host -p fb-dump
      - name: Build setup wizard
        run: cargo build --release --locked --manifest-path src/wwc-setup/Cargo.toml
      - name: Stage binaries
        shell: cmd
        run: |
          mkdir packaging\msix\bin
          copy /y target\release\win-host.exe packaging\msix\bin\
          copy /y target\release\fb-dump.exe packaging\msix\bin\
          copy /y src\wwc-setup\target\release\wwc-setup.exe packaging\msix\bin\
      - name: Stamp package version
        shell: pwsh
        run: |
          $v = "${{ env.RELEASE_TAG }}".TrimStart('v')
          if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { $v = '0.0.0' }
          $ver = "$v.0"
          $path = 'packaging/msix/AppxManifest.xml'
          # Case-sensitive + word boundary: only the Identity's standalone Version — not the
          # xml declaration's lowercase version="1.0", nor TargetDeviceFamily's MinVersion.
          (Get-Content $path -Raw) -creplace '\bVersion="[0-9.]+"', "Version=""$ver""" |
            Set-Content -NoNewline -Encoding utf8 $path
          Write-Host "AppxManifest version -> $ver"

      # --- Signing path A: SignPath (trusted; signs the CI-built artifact) ---------------
      - name: Build unsigned MSIX
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: cmd
        run: packaging\msix\build-msix.cmd packaging\msix\bin "%CD%\wayland-webgpu-composer-windows-x64.msix"
      - name: Upload unsigned MSIX artifact
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: msix-unsigned
          path: wayland-webgpu-composer-windows-x64.msix
      - name: Sign with SignPath
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: .

      # --- Signing path B: self-signed fallback (beta, until SignPath is configured) -----
      - name: Prepare self-signed certificate
        if: ${{ env.SIGNPATH_API_TOKEN == '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          $cer = Join-Path $env:GITHUB_WORKSPACE 'wayland-webgpu-composer.cer'
          if ($env:WWC_PFX_BASE64) {
            # Use the maintainer-provided certificate.
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WWC_PFX_BASE64))
            $col = [System.Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
            $col.Import($pfx, $env:WWC_PFX_PASSWORD, 'DefaultKeySet')
            [IO.File]::WriteAllBytes($cer, $col[0].Export('Cert'))
            "WWC_PFX_PASS=$env:WWC_PFX_PASSWORD" | Out-File $env:GITHUB_ENV -Append
          } else {
            # Self-signed beta code-signing cert (Microsoft tooling). Subject MUST match
            # AppxManifest Publisher (CN=wayland-webgpu-composer).
            $cert = New-SelfSignedCertificate -Type CodeSigningCert `
              -Subject 'CN=wayland-webgpu-composer' `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -KeyExportPolicy Exportable -KeyUsage DigitalSignature `
              -FriendlyName 'Wayland WebGPU Composer (beta, self-signed)' `
              -NotAfter (Get-Date).AddYears(5)
            $pass = ConvertTo-SecureString -String 'wwc-beta' -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pass | Out-Null
            Export-Certificate -Cert $cert -FilePath $cer | Out-Null
            "WWC_PFX_PASS=wwc-beta" | Out-File $env:GITHUB_ENV -Append
          }
          "WWC_PFX=$pfx" | Out-File $env:GITHUB_ENV -Append
      - name: Build & self-sign MSIX
        if: ${{ env.SIGNPATH_API_TOKEN == '' }}
        shell: cmd
        run: packaging\msix\build-msix.cmd packaging\msix\bin "%CD%\wayland-webgpu-composer-windows-x64.msix"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false
          files: |
            wayland-webgpu-composer-windows-x64.msix
            wayland-webgpu-composer.cer
            install_cert.cmd
            install_cert.sh
