[package]
name = "win-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Windows host that owns the WebGPU device and presents the composited framebuffer in a single scalable window."

[[bin]]
name = "win-host"
path = "src/main.rs"

[lib]
name = "win_host"
path = "src/lib.rs"

[dependencies]
bridge-protocol = { path = "../bridge-protocol" }
winit = "0.29"
wgpu = "22"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
log = "0.4"
env_logger = "0.11"

# Raw-Vulkan backend (ash + gpu-allocator), compiled only with `--features vulkan`.
ash = { version = "0.38", optional = true }
ash-window = { version = "0.13", optional = true }
gpu-allocator = { version = "0.27", default-features = false, features = ["vulkan"], optional = true }
raw-window-handle = { version = "0.6", optional = true }

[features]
default = []
# Enables the second render backend: raw Vulkan via `ash` + `gpu-allocator`. The `--backend
# vulkan` CLI flag only has an effect when win-host is built with this feature.
vulkan = ["dep:ash", "dep:ash-window", "dep:gpu-allocator", "dep:raw-window-handle"]

[dev-dependencies]
tempfile = "3"
