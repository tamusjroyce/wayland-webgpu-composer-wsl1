# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/

[advisories]
# Fail on crates with RustSec advisories or that have been yanked.
yanked = "deny"
# Only flag unmaintained crates among our own/first-party dependencies; deep transitive
# ones (e.g. ttf-parser, paste via winit/wgpu) have no upgrade path and shouldn't block CI.
unmaintained = "workspace"
ignore = []

[licenses]
# Only OSI-approved permissive licenses, compatible with MIT redistribution.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "OFL-1.1", # bundled fonts (egui default fonts)
]
confidence-threshold = 0.9

# egui's default fonts (epaint_default_fonts) ship under font licenses, including the
# non-SPDX Ubuntu Font License. These are redistributable; allow them for that crate only.
[[licenses.exceptions]]
name = "epaint_default_fonts"
allow = ["OFL-1.1", "LicenseRef-UFL-1.0"]

[bans]
# Duplicate dependency versions are common in large graphs; warn rather than fail.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
